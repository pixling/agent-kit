name: Something does not work
description: The proxy or a skill misbehaves.
labels: [bug]
body:
  - type: input
    id: host
    attributes:
      label: Host and version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `pixling doctor`
      render: text
